[project]
name = "digital-me"
version = "0.1.0"
description = "Personal, local-only AI digital human"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "kokoro>=0.9.4",
    "soundfile>=0.14.0",
    "en-core-web-sm",
    "faster-whisper>=1.2.1",
    "silero-vad>=6.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[project.scripts]
digital-me = "digital_me.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["digital_me"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "whitebox: written with knowledge of the implementation (branches, internal state)",
    "blackbox: written only against the public interface and its specification",
    "integration: real components wired together",
    "live: needs a running local Ollama; skipped automatically when unavailable",
]

[tool.coverage.run]
source = ["digital_me"]
branch = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
